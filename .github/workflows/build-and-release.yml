name: Build & Release PhoneBridge APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK
        run: |
          VERSION="1.3.${{ github.run_number }}"
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="${{ github.run_number }}" --stacktrace

      - name: Rename & Prepare APK and Manifest
        run: |
          VERSION="1.3.${{ github.run_number }}"
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/PB.apk
          cp app/build/outputs/apk/release/app-release.apk release-output/PhoneBridge.apk
          
          # Generate zero-rate-limit version.json
          cat <<EOF > release-output/version.json
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "$VERSION",
            "downloadUrl": "https://github.com/mdfrhd101/phone-bridge-native/releases/download/v$VERSION/PB.apk",
            "fallbackUrl": "https://github.com/mdfrhd101/phone-bridge-native/releases/latest/download/PB.apk",
            "lanDownloadUrl": "http://192.168.0.105:8080/PB.apk",
            "webReleaseUrl": "https://github.com/mdfrhd101/phone-bridge-native/releases/latest",
            "notes": "PB v$VERSION: Resilient CDN updates, zero rate limit, dynamic versioning fix (stops update loop), WhatsApp deep extraction, 1-tap copy number, and instant battery telemetry."
          }
          EOF
          cp release-output/version.json version.json
          echo "APK Size: $(ls -lh release-output/PB.apk | awk '{print $5}')"

      - name: Commit version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: sync version.json to v1.3.${{ github.run_number }} [skip ci]" || true
          git push origin main || true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v1.3.${{ github.run_number }}"
          echo "Releasing version $VERSION"
          gh release create "$VERSION" release-output/PB.apk release-output/PhoneBridge.apk release-output/version.json \
            --title "PB $VERSION" \
            --notes "Release $VERSION: End-to-end encrypted relay, redundant cloud mirrors, zero-latency LAN P2P sync, persistent host outbox with LAN re-sync, self-healing viewer stream, and seamless in-app OTA updates." \
            --latest

      # Update discovery is handled inside the app: HostActivity and ViewerActivity both run a
      # silent AppUpdater.checkForUpdate() on every resume against version.json. The previous
      # ntfy "update ready" push targeted a topic the app never subscribed to (dead), so it was
      # removed rather than left misleading.
