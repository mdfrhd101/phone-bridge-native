name: Build & Release PhoneBridge APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename & Prepare APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/PB.apk
          cp app/build/outputs/apk/release/app-release.apk release-output/PhoneBridge.apk
          echo "APK Size: $(ls -lh release-output/PB.apk | awk '{print $5}')"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v1.3.${{ github.run_number }}"
          echo "Releasing version $VERSION"
          gh release create "$VERSION" release-output/PB.apk release-output/PhoneBridge.apk \
            --title "PB $VERSION" \
            --notes "Release $VERSION: Deep WhatsApp message extraction, 1-tap Copy Number button, persistent local cache & silent background sync, individual delete & multi-select actions, and instant battery telemetry." \
            --latest

      - name: Broadcast OTA Notification to Phones
        run: |
          VERSION="v1.3.${{ github.run_number }}"
          curl -s -X POST https://ntfy.sh/pb_sec_9e2f41bc78a04d5881a2e9b3d0476a51 \
            -H "Title: 🚀 PB Update Ready (v1.3)" \
            -H "Priority: high" \
            -H "Tags: rocket,package" \
            -d "New version $VERSION is ready on GitHub. Open PB and tap Update." || true
